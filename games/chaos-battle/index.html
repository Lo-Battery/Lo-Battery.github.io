<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>カオスバトル・シミュレーター (Chaos Battle)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #111;
      font-family: "Impact", "Arial Black", "Meiryo", sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Stage Container (Fills Fullscreen cleanly on both PC & Mobile) */
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Bar */
    #toolbar {
      background: #e8e8e8;
      border-bottom: 2px solid #000;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      z-index: 50;
      flex-shrink: 0;
    }

    .tool-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    button {
      background: #fff;
      border: 2px solid #000;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #000;
      transition: all 0.05s;
    }
    button:hover {
      background: #ffe600;
    }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #000;
    }
    button.btn-green {
      background: #44dd44;
      color: #000;
    }
    button.btn-red {
      background: #ff3333;
      color: #fff;
    }

    /* Subtitle Banner */
    #subtitle-bar {
      height: 34px;
      background: #000;
      color: #ffff00;
      border-bottom: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      font-size: 1.05rem;
      font-weight: 900;
      text-shadow: 1px 1px 0 #ff0000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 40;
      flex-shrink: 0;
    }

    /* ======================================================================
       6x6 GRID ARENA (Exact Scratch Chaos Battle Layout)
       ====================================================================== */
    #grid-arena {
      flex: 1;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      background: #fff;
      position: relative;
    }

    .grid-cell {
      border-right: 1.5px solid #000;
      border-bottom: 1.5px solid #000;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1px;
      cursor: pointer;
      background: #fff;
      overflow: hidden;
    }
    .grid-cell.highlight-attacker {
      background: #ffff44 !important;
      animation: cellBlink 0.12s infinite alternate;
    }
    .grid-cell.highlight-target {
      background: #ff8888 !important;
    }
    @keyframes cellBlink {
      from { filter: brightness(1); }
      to { filter: brightness(1.35); }
    }

    .cell-img {
      max-width: 85%;
      max-height: 72%;
      object-fit: contain;
      pointer-events: none;
    }

    .cell-name {
      font-size: 0.65rem;
      font-weight: 900;
      color: #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 95%;
      line-height: 1.1;
      margin-top: 1px;
    }

    .cell-hp {
      font-size: 0.62rem;
      font-weight: 900;
      color: #cc0000;
      line-height: 1;
    }

    /* Red "X" Stamp */
    .cell-dead-x {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 3.8rem;
      font-weight: 900;
      color: rgba(230, 0, 0, 0.92);
      text-shadow: 2px 2px 0 #000;
      z-index: 10;
    }
    .grid-cell.dead {
      background: #e2e2e2 !important;
    }
    .grid-cell.dead .cell-img {
      filter: grayscale(100%) opacity(0.35);
    }
    .grid-cell.dead .cell-dead-x {
      display: flex;
    }

    .cell-empty {
      background: #fafafa;
      color: #aaa;
      font-size: 1.6rem;
      border: 1.5px dashed #ccc;
    }
    .cell-empty:hover {
      background: #eef;
      border-color: #00f;
      color: #00f;
    }

    /* BIG RED ARROW (Scratch Style) */
    #arrow-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    #effect-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 35;
    }

    .scratch-boom {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 3.2rem;
      animation: boomAnim 0.3s forwards ease-out;
      pointer-events: none;
    }
    @keyframes boomAnim {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }

    .scratch-dmg-text {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      font-weight: 900;
      color: #ff0000;
      text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 3px 0 #000;
      animation: dmgPop 0.4s forwards ease-out;
      pointer-events: none;
    }
    @keyframes dmgPop {
      0% { transform: translate(-50%, -50%) scale(0.4) translateY(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3) translateY(-15px); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1) translateY(-30px); opacity: 0; }
    }

    /* Winner Banner */
    #winner-banner {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 235, 0, 0.98);
      border: 5px solid #ff0000;
      padding: 18px 36px;
      font-size: 2.1rem;
      font-weight: 900;
      color: #ff0000;
      text-shadow: 2px 2px 0 #fff;
      box-shadow: 0 0 30px rgba(0,0,0,0.85);
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    /* Upload Modal */
    #upload-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: #fff;
      border: 4px solid #000;
      padding: 16px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 6px 6px 0 #000;
    }
    .modal-card h3 {
      font-size: 1.1rem;
      border-bottom: 2px solid #000;
      padding-bottom: 4px;
    }
    .modal-card input {
      border: 2px solid #000;
      padding: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <!-- Top Toolbar -->
  <div id="toolbar">
    <div class="tool-group">
      <button class="btn-green" id="btn-toggle">⏸ 一時停止</button>
      <button id="btn-step">⏭ 1手進む</button>
      <button id="btn-restart">🔄 最初から再戦</button>
      <button id="btn-speed">⚡ 速度: 1x</button>
    </div>
    <div class="tool-group">
      <button class="btn-red" id="btn-add-char">＋ 画像をアップロードして追加</button>
      <button id="btn-reset-chars">初期配置に戻す</button>
    </div>
  </div>

  <!-- Subtitle Bar -->
  <div id="subtitle-bar">カオスバトル開幕！！クリックして画像キャラも追加できるぞ！</div>

  <!-- 6x6 Grid Arena -->
  <div id="grid-arena"></div>

  <!-- SVG for Big Fat Red Arrow (Exact scratch style!) -->
  <svg id="arrow-overlay">
    <defs>
      <marker id="arrowhead" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
        <polygon points="0 0, 7 3, 0 6" fill="#ff0000" stroke="#b30000" stroke-width="0.3" />
      </marker>
    </defs>
    <line id="red-arrow" x1="0" y1="0" x2="0" y2="0" stroke="#ff0000" stroke-width="20" stroke-linecap="butt" marker-end="url(#arrowhead)" style="display:none;" />
  </svg>

  <!-- Effects Overlay -->
  <div id="effect-overlay"></div>

  <!-- Winner Banner -->
  <div id="winner-banner">
    <div id="winner-title">勝者：ドナルド！！</div>
    <div style="font-size:1.1rem; color:#000;" id="winner-quote">「ランランルー！自然と体が動いちゃうんだ☆」</div>
    <button class="btn-green" id="btn-winner-restart" style="margin-top:10px; font-size:1.1rem; padding:8px 24px;">🔄 もう一度戦う！</button>
  </div>

  <!-- Modal for Uploading Custom Image -->
  <div id="upload-modal">
    <div class="modal-card">
      <h3>📁 画像キャラの追加</h3>
      <input type="file" id="file-selector" accept="image/*" />
      <input type="text" id="custom-name" placeholder="キャラ名（例: 俺、友達、ミーム）" />
      <input type="number" id="custom-hp" placeholder="HP (例: 100)" value="100" />
      <input type="text" id="custom-skill" placeholder="必殺技名" value="スーパーメガ粒子砲" />
      <input type="text" id="custom-quote" placeholder="セリフ" value="喰らえええええ！" />
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button id="btn-cancel-modal">キャンセル</button>
        <button class="btn-green" id="btn-save-modal">追加する！</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   SIMPLE WEB AUDIO
   ========================================================================== */
class ScratchAudio {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playPunch() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(20, t + 0.1);
    g.gain.setValueAtTime(0.8, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.11);
  }
  playExplosion() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const bufSize = Math.floor(this.ctx.sampleRate * 0.35);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(600, t);
    f.frequency.linearRampToValueAtTime(60, t + 0.35);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t);
  }
  playBell() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1568, t);
    g.gain.setValueAtTime(0.7, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 1.05);
  }
  playFanfare() {
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const t = this.ctx.currentTime + idx * 0.12;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.4, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + (idx === 3 ? 0.8 : 0.2));
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + (idx === 3 ? 0.85 : 0.22));
    });
  }
}
const audio = new ScratchAudio();

/* ==========================================================================
   DEFAULT CHARACTERS (SVG Memes matching scratch culture)
   ========================================================================== */
function makeIconSvg(text, bgCol, char) {
  return "data:image/svg+xml;utf8," + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="${bgCol}"/>
      <text x="50" y="55" font-size="50" text-anchor="middle" dominant-baseline="central">${char}</text>
      <text x="50" y="88" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" stroke="#000" stroke-width="0.8">${text}</text>
    </svg>
  `);
}

const DEFAULT_ROSTER = [

/* ==========================================================================
   CHAOS BATTLE ENGINE
   ========================================================================== */
class ScratchChaosBattle {
  constructor() {
    this.totalSlots = 36; // 6 cols x 6 rows = 36 slots
    this.fighters = [];
    this.isRunning = true;
    this.timer = null;
    this.speedIndex = 0;
    this.speeds = [1, 2, 4, 10];
    this.speedLabels = ["1x", "2x", "4x", "爆速"];
    this.tempUploadData = null;

    this.initFighters();
    this.renderGrid();
    this.bindEvents();

    // Start battle immediately
    this.start();
  }

  initFighters() {
    let custom = [];
    try {
      const s = localStorage.getItem("scratch_chaos_custom");
      if (s) custom = JSON.parse(s);
    } catch (e) {}

    const rosterSource = [...DEFAULT_ROSTER, ...custom];
    this.fighters = [];

    for (let i = 0; i < this.totalSlots; i++) {
      if (i < rosterSource.length) {
        const item = rosterSource[i];
        this.fighters.push({
          id: i,
          name: item.name,
          img: item.img || makeIconSvg(item.name, item.col || "#ff2222", item.char || "★"),
          hp: item.hp || 100,
          maxHp: item.hp || 100,
          skill: item.skill || "こうげき",
          quote: item.quote || "くらえっ！",
          isAlive: true
        });
      } else {
        this.fighters.push(null);
      }
    }
  }

  renderGrid() {
    const arena = document.getElementById("grid-arena");
    arena.innerHTML = "";

    this.fighters.forEach((f, idx) => {
      const cell = document.createElement("div");
      cell.className = "grid-cell" + (f && !f.isAlive ? " dead" : "");
      cell.id = `cell-${idx}`;

      if (f) {
        cell.innerHTML = `
          <div class="cell-dead-x">✕</div>
          <img class="cell-img" src="${f.img}" alt="${f.name}" />
          <div class="cell-name">${f.name}</div>
          <div class="cell-hp" id="hp-val-${idx}">HP: ${f.hp}</div>
        `;
        cell.onclick = () => this.onCellClicked(idx);
      } else {
        cell.className += " cell-empty";
        cell.innerHTML = `<span>＋</span>`;
        cell.onclick = () => this.openAddModal(idx);
      }

      arena.appendChild(cell);
    });
  }

  bindEvents() {
    const btnToggle = document.getElementById("btn-toggle");
    btnToggle.onclick = () => {
      audio.init();
      if (this.isRunning) this.pause();
      else this.start();
    };

    document.getElementById("btn-step").onclick = () => {
      audio.init();
      this.pause();
      this.step();
    };

    const doRestart = () => {
      audio.init();
      this.pause();
      this.fighters.forEach(f => {
        if (f) {
          f.hp = f.maxHp;
          f.isAlive = true;
        }
      });
      document.getElementById("winner-banner").style.display = "none";
      this.clearArrow();
      this.renderGrid();
      document.getElementById("subtitle-bar").textContent = "全員復活！！カオスバトル再戦スタート！！";
      this.start();
    };
    document.getElementById("btn-restart").onclick = doRestart;
    document.getElementById("btn-winner-restart").onclick = doRestart;

    const btnSpeed = document.getElementById("btn-speed");
    btnSpeed.onclick = () => {
      this.speedIndex = (this.speedIndex + 1) % this.speeds.length;
      btnSpeed.textContent = `⚡ 速度: ${this.speedLabels[this.speedIndex]}`;
      if (this.isRunning) {
        this.pause();
        this.start();
      }
    };

    document.getElementById("btn-reset-chars").onclick = () => {
      if (confirm("キャラクターを初期状態に戻しますか？")) {
        localStorage.removeItem("scratch_chaos_custom");
        this.pause();
        this.initFighters();
        this.renderGrid();
        document.getElementById("winner-banner").style.display = "none";
        this.start();
      }
    };

    document.getElementById("btn-add-char").onclick = () => {
      const emptyIdx = this.fighters.findIndex(f => f === null);
      this.openAddModal(emptyIdx >= 0 ? emptyIdx : this.fighters.length - 1);
    };

    document.getElementById("file-selector").onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          this.tempUploadData = ev.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    document.getElementById("btn-cancel-modal").onclick = () => {
      document.getElementById("upload-modal").style.display = "none";
    };
    document.getElementById("btn-save-modal").onclick = () => {
      this.saveCustomCharacter();
    };
  }

  getInterval() {
    const s = this.speeds[this.speedIndex];
    return Math.max(30, Math.floor(900 / s));
  }

  start() {
    this.isRunning = true;
    document.getElementById("btn-toggle").textContent = "⏸ 一時停止";
    document.getElementById("btn-toggle").className = "btn-red";
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => {
      this.step();
    }, this.getInterval());
  }

  pause() {
    this.isRunning = false;
    document.getElementById("btn-toggle").textContent = "▶ スタート";
    document.getElementById("btn-toggle").className = "btn-green";
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
  }

  step() {
    const aliveIndices = this.fighters
      .map((f, i) => (f && f.isAlive ? i : -1))
      .filter(i => i >= 0);

    if (aliveIndices.length <= 1) {
      this.pause();
      this.announceWinner(aliveIndices[0]);
      return;
    }

    const actorIdx = aliveIndices[Math.floor(Math.random() * aliveIndices.length)];
    const targetCandidates = aliveIndices.filter(i => i !== actorIdx);
    if (targetCandidates.length === 0) return;
    const targetIdx = targetCandidates[Math.floor(Math.random() * targetCandidates.length)];

    const actor = this.fighters[actorIdx];
    const target = this.fighters[targetIdx];

    const dmg = Math.floor(25 + Math.random() * 35);
    target.hp = Math.max(0, target.hp - dmg);
    const isDead = target.hp === 0;
    if (isDead) target.isAlive = false;

    document.getElementById("subtitle-bar").textContent = `${actor.name}「${actor.quote}」 → ${actor.skill}！！`;

    this.drawArrow(actorIdx, targetIdx);

    const spd = this.speeds[this.speedIndex];
    if (isDead) {
      audio.playExplosion();
      setTimeout(() => audio.playBell(), 150 / spd);
    } else {
      audio.playPunch();
    }

    this.spawnBoom(targetIdx, dmg);

    const hpEl = document.getElementById(`hp-val-${targetIdx}`);
    if (hpEl) hpEl.textContent = `HP: ${target.hp}`;

    if (isDead) {
      const cellTarget = document.getElementById(`cell-${targetIdx}`);
      if (cellTarget) cellTarget.classList.add("dead");
    }

    const holdMs = Math.max(20, Math.floor(400 / spd));
    setTimeout(() => {
      this.clearArrow();
      if (this.fighters.filter(f => f && f.isAlive).length <= 1) {
        this.step();
      }
    }, holdMs);
  }

  drawArrow(actorIdx, targetIdx) {
    const cellA = document.getElementById(`cell-${actorIdx}`);
    const cellT = document.getElementById(`cell-${targetIdx}`);
    if (!cellA || !cellT) return;

    cellA.classList.add("highlight-attacker");
    cellT.classList.add("highlight-target");

    const arena = document.getElementById("grid-arena");
    const rectArena = arena.getBoundingClientRect();
    const rectA = cellA.getBoundingClientRect();
    const rectT = cellT.getBoundingClientRect();

    const x1 = rectA.left + rectA.width / 2 - rectArena.left;
    const y1 = rectA.top + rectA.height / 2 - rectArena.top;
    const x2 = rectT.left + rectT.width / 2 - rectArena.left;
    const y2 = rectT.top + rectT.height / 2 - rectArena.top;

    const line = document.getElementById("red-arrow");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.style.display = "block";
  }

  clearArrow() {
    const line = document.getElementById("red-arrow");
    if (line) line.style.display = "none";
    document.querySelectorAll(".grid-cell").forEach(c => {
      c.classList.remove("highlight-attacker", "highlight-target");
    });
  }

  spawnBoom(targetIdx, dmg) {
    const cell = document.getElementById(`cell-${targetIdx}`);
    if (!cell) return;
    const arena = document.getElementById("grid-arena");
    const rectArena = arena.getBoundingClientRect();
    const rect = cell.getBoundingClientRect();

    const cx = rect.left + rect.width / 2 - rectArena.left;
    const cy = rect.top + rect.height / 2 - rectArena.top;

    const overlay = document.getElementById("effect-overlay");

    const boom = document.createElement("div");
    boom.className = "scratch-boom";
    boom.textContent = "💥";
    boom.style.left = `${cx}px`;
    boom.style.top = `${cy}px`;
    overlay.appendChild(boom);

    const num = document.createElement("div");
    num.className = "scratch-dmg-text";
    num.textContent = `-${dmg}`;
    num.style.left = `${cx}px`;
    num.style.top = `${cy - 10}px`;
    overlay.appendChild(num);

    setTimeout(() => {
      boom.remove();
      num.remove();
    }, 450);
  }

  announceWinner(winnerIdx) {
    audio.playFanfare();
    const winner = this.fighters[winnerIdx];
    const banner = document.getElementById("winner-banner");
    if (winner) {
      document.getElementById("winner-title").textContent = `勝者：${winner.name}！！`;
      document.getElementById("winner-quote").textContent = `「${winner.quote}」`;
    } else {
      document.getElementById("winner-title").textContent = "引き分け！！";
      document.getElementById("winner-quote").textContent = "全員相討ちにより勝者なし！";
    }
    banner.style.display = "flex";
  }

  openAddModal(slotIdx) {
    this.targetSlotIdx = slotIdx;
    this.tempUploadData = null;
    document.getElementById("custom-name").value = "";
    document.getElementById("custom-hp").value = "100";
    document.getElementById("file-selector").value = "";
    document.getElementById("upload-modal").style.display = "flex";
  }

  saveCustomCharacter() {
    const name = document.getElementById("custom-name").value.trim() || "オリジナル戦士";
    const hp = parseInt(document.getElementById("custom-hp").value, 10) || 100;
    const skill = document.getElementById("custom-skill").value.trim() || "必殺技";
    const quote = document.getElementById("custom-quote").value.trim() || "喰らいなさい！";

    const img = this.tempUploadData || makeIconSvg(name, "#ff00bb", "★");

    const newChar = {
      name,
      img,
      hp,
      skill,
      quote
    };

    try {
      let custom = [];
      const s = localStorage.getItem("scratch_chaos_custom");
      if (s) custom = JSON.parse(s);
      custom.push(newChar);
      localStorage.setItem("scratch_chaos_custom", JSON.stringify(custom));
    } catch (e) {}

    document.getElementById("upload-modal").style.display = "none";
    this.initFighters();
    this.renderGrid();
    document.getElementById("subtitle-bar").textContent = `「${name}」がカオスバトルに参戦した！！`;
  }

  onCellClicked(idx) {
    const f = this.fighters[idx];
    if (!f) return;
    if (!f.isAlive) {
      f.isAlive = true;
      f.hp = f.maxHp;
      this.renderGrid();
      document.getElementById("subtitle-bar").textContent = `${f.name} が奇跡の復活！！`;
    } else {
      audio.init();
      this.fighters.forEach((other, otherIdx) => {
        if (other && other.isAlive && otherIdx !== idx) {
          other.hp = Math.max(0, other.hp - 40);
          if (other.hp === 0) other.isAlive = false;
        }
      });
      audio.playExplosion();
      this.drawArrow(idx, (idx + 1) % this.totalSlots);
      setTimeout(() => this.clearArrow(), 250);
      this.renderGrid();
      document.getElementById("subtitle-bar").textContent = `${f.name}「${f.quote}」 全員に大打撃！！`;
    }
  }
}

window.addEventListener("DOMContentLoaded", () => {
  window.chaosApp = new ScratchChaosBattle();
});
</script>
