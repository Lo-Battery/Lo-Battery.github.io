<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>カオスバトル・シミュレーター (Chaos Battle)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #111;
      font-family: "Impact", "Arial Black", "Meiryo", sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Stage Container (Fills Fullscreen cleanly on both PC & Mobile) */
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Bar */
    #toolbar {
      background: #e8e8e8;
      border-bottom: 2px solid #000;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      z-index: 50;
      flex-shrink: 0;
    }

    .tool-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    button {
      background: #fff;
      border: 2px solid #000;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #000;
      transition: all 0.05s;
    }
    button:hover {
      background: #ffe600;
    }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #000;
    }
    button.btn-green {
      background: #44dd44;
      color: #000;
    }
    button.btn-red {
      background: #ff3333;
      color: #fff;
    }

    /* Subtitle Banner */
    #subtitle-bar {
      height: 34px;
      background: #000;
      color: #ffff00;
      border-bottom: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      font-size: 1.05rem;
      font-weight: 900;
      text-shadow: 1px 1px 0 #ff0000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 40;
      flex-shrink: 0;
    }

    /* ======================================================================
       ARENA WRAPPER & 6x6 GRID ARENA (Exact Scratch Chaos Battle Layout)
       ====================================================================== */
    #arena-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #grid-arena {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      background: #fff;
    }

    .grid-cell {
      border-right: 1.5px solid #000;
      border-bottom: 1.5px solid #000;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1px;
      cursor: pointer;
      background: #fff;
      overflow: hidden;
    }
    .grid-cell.highlight-attacker {
      background: #ffff44 !important;
      animation: cellBlink 0.12s infinite alternate;
    }
    .grid-cell.highlight-special {
      background: #ffea00 !important;
      box-shadow: inset 0 0 16px #ff0000;
      animation: specialPulse 0.08s infinite alternate;
    }
    .grid-cell.highlight-target {
      background: #ff8888 !important;
    }
    @keyframes cellBlink {
      from { filter: brightness(1); }
      to { filter: brightness(1.35); }
    }
    @keyframes specialPulse {
      from { filter: brightness(1) drop-shadow(0 0 4px #ff0000); }
      to { filter: brightness(1.4) drop-shadow(0 0 12px #ffaa00); }
    }

    .cell-img {
      max-width: 85%;
      max-height: 72%;
      object-fit: contain;
      pointer-events: none;
    }

    .cell-name {
      font-size: 0.65rem;
      font-weight: 900;
      color: #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 95%;
      line-height: 1.1;
      margin-top: 1px;
    }

    .cell-hp {
      font-size: 0.62rem;
      font-weight: 900;
      color: #cc0000;
      line-height: 1;
    }

    /* Red "X" Stamp */
    .cell-dead-x {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 3.8rem;
      font-weight: 900;
      color: rgba(230, 0, 0, 0.92);
      text-shadow: 2px 2px 0 #000;
      z-index: 10;
    }
    .grid-cell.dead {
      background: #e2e2e2 !important;
    }
    .grid-cell.dead .cell-img {
      filter: grayscale(100%) opacity(0.35);
    }
    .grid-cell.dead .cell-dead-x {
      display: flex;
    }

    .cell-empty {
      background: #fafafa;
      color: #aaa;
      font-size: 1.6rem;
      border: 1.5px dashed #ccc;
    }
    .cell-empty:hover {
      background: #eef;
      border-color: #00f;
      color: #00f;
    }

    /* BIG RED ARROW (Scratch Style) */
    #arrow-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    #effect-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 35;
    }

    .scratch-boom {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 3.2rem;
      animation: boomAnim 0.3s forwards ease-out;
      pointer-events: none;
    }
    @keyframes boomAnim {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }

    .scratch-dmg-text {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      font-weight: 900;
      color: #ff0000;
      text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 3px 0 #000;
      animation: dmgPop 0.4s forwards ease-out;
      pointer-events: none;
    }
    @keyframes dmgPop {
      0% { transform: translate(-50%, -50%) scale(0.4) translateY(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3) translateY(-15px); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1) translateY(-30px); opacity: 0; }
    }

    /* Winner Banner */
    #winner-banner {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 235, 0, 0.98);
      border: 5px solid #ff0000;
      padding: 18px 36px;
      font-size: 2.1rem;
      font-weight: 900;
      color: #ff0000;
      text-shadow: 2px 2px 0 #fff;
      box-shadow: 0 0 30px rgba(0,0,0,0.85);
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    /* Upload Modal */
    #upload-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: #fff;
      border: 4px solid #000;
      padding: 16px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 6px 6px 0 #000;
    }
    .modal-card h3 {
      font-size: 1.1rem;
      border-bottom: 2px solid #000;
      padding-bottom: 4px;
    }
    .modal-card input {
      border: 2px solid #000;
      padding: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
  </style>
</head>

      <input type="text" id="custom-quote" placeholder="通常セリフ（例: いくぞ！）" value="いくぞ！" />
      <div style="border-top:1px dashed #ccc; margin:4px 0; padding-top:4px;">
        <span style="font-size:0.8rem; font-weight:900; color:#ff0033;">💥 本家風 必殺技設定:</span>

        <input type="text" id="custom-special-quote" placeholder="必殺技セリフ（例: 喰らえええええ！）" value="喰らえええええ！" />

  </div>
</div>

/* ==========================================================================
   SIMPLE WEB AUDIO
   ========================================================================== */
class ScratchAudio {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playPunch() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(20, t + 0.1);
    g.gain.setValueAtTime(0.8, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.11);
  }
  playExplosion() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const bufSize = Math.floor(this.ctx.sampleRate * 0.35);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(600, t);
    f.frequency.linearRampToValueAtTime(60, t + 0.35);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t);
  }
  playSpecialCharge() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(800, t + 0.18);
    g.gain.setValueAtTime(0.01, t);
    g.gain.linearRampToValueAtTime(0.5, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.23);
  }
  playMegaBlast() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const bufSize = Math.floor(this.ctx.sampleRate * 0.5);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.2));
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(800, t);
    f.frequency.linearRampToValueAtTime(40, t + 0.5);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(1.0, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t);
  }
  playBell() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1568, t);
    g.gain.setValueAtTime(0.7, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 1.05);
  }
  playFanfare() {
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const t = this.ctx.currentTime + idx * 0.12;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.4, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + (idx === 3 ? 0.8 : 0.2));
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + (idx === 3 ? 0.85 : 0.22));
    });
  }
}
const audio = new ScratchAudio();

function makeIconSvg(text, bgCol, char) {
  return "data:image/svg+xml;utf8," + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="${bgCol}"/>
      <text x="50" y="55" font-size="50" text-anchor="middle" dominant-baseline="central">${char}</text>
      <text x="50" y="88" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" stroke="#000" stroke-width="0.8">${text}</text>
    </svg>
  `);
}

/* ==========================================================================
   CHAOS BATTLE ENGINE
   ========================================================================== */
class ScratchChaosBattle {
  constructor() {
    this.totalSlots = 36; // 6 cols x 6 rows = 36 slots
    this.fighters = [];
    this.isRunning = true;
    this.timer = null;
    this.speedIndex = 0;
    this.speeds = [1, 2, 4, 10];
    this.speedLabels = ["1x", "2x", "4x", "爆速"];
    this.tempUploadData = null;

    this.initFighters();
    this.renderGrid();
    this.bindEvents();

    // Start battle immediately
    this.start();
  }

  initFighters() {
    let custom = [];
    try {
      const s = localStorage.getItem("scratch_chaos_custom");
      if (s) custom = JSON.parse(s);
    } catch (e) {}

    const rosterSource = [...DEFAULT_ROSTER, ...custom];
    this.fighters = [];

    for (let i = 0; i < this.totalSlots; i++) {
      if (i < rosterSource.length) {
        const item = rosterSource[i];
        this.fighters.push({
          id: i,
          name: item.name,
          img: item.img || makeIconSvg(item.name, item.col || "#ff2222", item.char || "★"),
          hp: item.hp || 100,
          maxHp: item.hp || 100,
          skill: item.skill || "こうげき",
          quote: item.quote || "くらえっ！",
          specialName: item.specialName || "超必殺メガトン砲",
          specialType: item.specialType || "kill",
          specialQuote: item.specialQuote || item.quote || "これで終わりだ！",
          isAlive: true
        });
      } else {
        this.fighters.push(null);
      }
    }
  }

  renderGrid() {
    const arena = document.getElementById("grid-arena");
    arena.innerHTML = "";

    this.fighters.forEach((f, idx) => {
      const cell = document.createElement("div");
      cell.className = "grid-cell" + (f && !f.isAlive ? " dead" : "");
      cell.id = `cell-${idx}`;

      if (f) {
        cell.innerHTML = `
          <div class="cell-dead-x">✕</div>
          <img class="cell-img" src="${f.img}" alt="${f.name}" />
          <div class="cell-name">${f.name}</div>
          <div class="cell-hp" id="hp-val-${idx}">HP: ${f.hp}</div>
        `;
        cell.onclick = () => this.onCellClicked(idx);
      } else {
        cell.className += " cell-empty";
        cell.innerHTML = `<span>＋</span>`;
        cell.onclick = () => this.openAddModal(idx);
      }

      arena.appendChild(cell);
    });
  }

  bindEvents() {
    const btnToggle = document.getElementById("btn-toggle");
    btnToggle.onclick = () => {
      audio.init();
      if (this.isRunning) this.pause();
      else this.start();
    };

    document.getElementById("btn-step").onclick = () => {
      audio.init();
      this.pause();
      this.step();
    };

    const doRestart = () => {
      audio.init();
      this.pause();
      this.fighters.forEach(f => {
        if (f) {
          f.hp = f.maxHp;
          f.isAlive = true;
        }
      });
      document.getElementById("winner-banner").style.display = "none";
      this.clearArrows();
      this.renderGrid();
      document.getElementById("subtitle-bar").textContent = "全員復活！！カオスバトル再戦スタート！！";
      this.start();
    };
    document.getElementById("btn-restart").onclick = doRestart;
    document.getElementById("btn-winner-restart").onclick = doRestart;

    const btnSpeed = document.getElementById("btn-speed");
    btnSpeed.onclick = () => {
      this.speedIndex = (this.speedIndex + 1) % this.speeds.length;
      btnSpeed.textContent = `⚡ 速度: ${this.speedLabels[this.speedIndex]}`;
      if (this.isRunning) {
        this.start();
      }
    };

    document.getElementById("btn-reset-chars").onclick = () => {
      if (confirm("キャラクターを初期状態に戻しますか？")) {
        localStorage.removeItem("scratch_chaos_custom");
        this.pause();
        this.initFighters();
        this.renderGrid();
        document.getElementById("winner-banner").style.display = "none";
        this.start();
      }
    };

    document.getElementById("btn-add-char").onclick = () => {
      const emptyIdx = this.fighters.findIndex(f => f === null);
      this.openAddModal(emptyIdx >= 0 ? emptyIdx : this.fighters.length - 1);
    };

    document.getElementById("file-selector").onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          this.tempUploadData = ev.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    document.getElementById("btn-cancel-modal").onclick = () => {
      document.getElementById("upload-modal").style.display = "none";
    };
    document.getElementById("btn-save-modal").onclick = () => {
      this.saveCustomCharacter();
    };

    // Space key to toggle play/pause
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target.tagName !== "INPUT") {
        e.preventDefault();
        btnToggle.click();
      }
    });
  }

  getInterval() {
    const s = this.speeds[this.speedIndex];
    return Math.max(25, Math.floor(520 / s));
  }

  start() {
    this.isRunning = true;
    document.getElementById("btn-toggle").textContent = "⏸ 一時停止";
    document.getElementById("btn-toggle").className = "btn-red";
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => {
      this.step();
    }, this.getInterval());
  }

  pause() {
    this.isRunning = false;
    document.getElementById("btn-toggle").textContent = "▶ スタート";
    document.getElementById("btn-toggle").className = "btn-green";
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
  }

  step(forcedActorIdx = null, forceSpecial = false) {
    const aliveIndices = this.fighters
      .map((f, i) => (f && f.isAlive ? i : -1))
      .filter(i => i >= 0);

    if (aliveIndices.length <= 1) {
      this.pause();
      this.announceWinner(aliveIndices[0]);
      return;
    }

    const actorIdx = (forcedActorIdx !== null && this.fighters[forcedActorIdx] && this.fighters[forcedActorIdx].isAlive)
      ? forcedActorIdx
      : aliveIndices[Math.floor(Math.random() * aliveIndices.length)];

    const actor = this.fighters[actorIdx];
    const targetCandidates = aliveIndices.filter(i => i !== actorIdx);
    if (targetCandidates.length === 0) return;

    const spd = this.speeds[this.speedIndex];

    // Determine special move:
    // Base 28% chance, or 55% if HP <= 45 (pinch reversal excitement!)
    const isPinch = actor.hp <= 45;
    const specialChance = isPinch ? 0.55 : 0.28;
    const isSpecial = forceSpecial || (actor.specialName && Math.random() < specialChance);

    let targets = [];
    let dmg = 0;

    if (isSpecial) {
      audio.playSpecialCharge();

      if (actor.specialType === "all") {
        // Multi-target attack (hits 2 to 4 enemies at once)
        const hitCount = Math.min(targetCandidates.length, Math.floor(2 + Math.random() * 3));
        const shuffled = [...targetCandidates].sort(() => Math.random() - 0.5);
        targets = shuffled.slice(0, hitCount);
        dmg = Math.floor(50 + Math.random() * 35);
      } else if (actor.specialType === "bomb") {
        // Kamikaze attack
        const t = targetCandidates[Math.floor(Math.random() * targetCandidates.length)];
        targets = [t];
        dmg = 130;
      } else {
        // Instant Kill / Massive Strike
        const t = targetCandidates[Math.floor(Math.random() * targetCandidates.length)];
        targets = [t];
        dmg = Math.floor(110 + Math.random() * 70);
      }

      document.getElementById("subtitle-bar").innerHTML = 
        `<span style="color:#ff2222; font-weight:900; background:#fff; padding:1px 6px; border-radius:3px; margin-right:6px; box-shadow:1px 1px 0 #000;">💥【必殺技】</span>` +
        `${actor.name}「${actor.specialQuote || actor.quote}」 → <span style="color:#ff3355;">${actor.specialName}</span>！！`;
    } else {
      // Normal attack
      const t = targetCandidates[Math.floor(Math.random() * targetCandidates.length)];
      targets = [t];
      dmg = Math.floor(40 + Math.random() * 28);
      document.getElementById("subtitle-bar").textContent = 
        `${actor.name}「${actor.quote}」 → ${actor.skill}！！`;
    }

    // Draw arrows from actor to targets (100% mathematically aligned to SVG overlay)
    this.drawArrows(actorIdx, targets, isSpecial);

    // Apply damage to all targets
    let anyKilled = false;
    targets.forEach(tIdx => {
      const target = this.fighters[tIdx];
      target.hp = Math.max(0, target.hp - dmg);
      const isDead = target.hp === 0;
      if (isDead) {
        target.isAlive = false;
        anyKilled = true;
      }

      this.spawnBoom(tIdx, dmg, isSpecial);

      const hpEl = document.getElementById(`hp-val-${tIdx}`);
      if (hpEl) hpEl.textContent = `HP: ${target.hp}`;

      if (isDead) {
        const cellTarget = document.getElementById(`cell-${tIdx}`);
        if (cellTarget) cellTarget.classList.add("dead");
      }
    });

    // If bomb type, attacker also suffers self-destruct damage
    if (isSpecial && actor.specialType === "bomb") {
      actor.hp = 0;
      actor.isAlive = false;
      anyKilled = true;
      const cellActor = document.getElementById(`cell-${actorIdx}`);
      if (cellActor) cellActor.classList.add("dead");
      const hpEl = document.getElementById(`hp-val-${actorIdx}`);
      if (hpEl) hpEl.textContent = "HP: 0";
      this.spawnBoom(actorIdx, 999, true);
    }

    // Sound effects
    if (isSpecial) {
      setTimeout(() => audio.playMegaBlast(), 50 / spd);
      if (anyKilled) setTimeout(() => audio.playBell(), 160 / spd);
    } else {
      if (anyKilled) {
        audio.playExplosion();
        setTimeout(() => audio.playBell(), 120 / spd);
      } else {
        audio.playPunch();
      }
    }

    const holdMs = Math.max(15, Math.floor(220 / spd));
    setTimeout(() => {
      this.clearArrows();
      if (this.fighters.filter(f => f && f.isAlive).length <= 1) {
        this.step();
      }
    }, holdMs);
  }

  drawArrows(actorIdx, targetIndices, isSpecial = false) {
    this.clearArrows();
    const cellA = document.getElementById(`cell-${actorIdx}`);
    if (!cellA) return;

    cellA.classList.add(isSpecial ? "highlight-special" : "highlight-attacker");

    const svg = document.getElementById("arrow-overlay");
    const rectSvg = svg.getBoundingClientRect();
    const rectA = cellA.getBoundingClientRect();
    const x1 = rectA.left + rectA.width / 2 - rectSvg.left;
    const y1 = rectA.top + rectA.height / 2 - rectSvg.top;

    targetIndices.forEach(tIdx => {
      const cellT = document.getElementById(`cell-${tIdx}`);
      if (!cellT) return;
      cellT.classList.add("highlight-target");
      const rectT = cellT.getBoundingClientRect();
      const x2 = rectT.left + rectT.width / 2 - rectSvg.left;
      const y2 = rectT.top + rectT.height / 2 - rectSvg.top;

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);
      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);
      line.setAttribute("stroke", isSpecial ? "#ff0022" : "#ff0000");
      line.setAttribute("stroke-width", isSpecial ? "22" : "18");
      line.setAttribute("stroke-linecap", "butt");
      line.setAttribute("marker-end", isSpecial ? "url(#arrowhead-special)" : "url(#arrowhead)");
      line.classList.add("active-arrow");
      svg.appendChild(line);
    });
  }

  clearArrows() {
    const svg = document.getElementById("arrow-overlay");
    if (svg) {
      svg.querySelectorAll(".active-arrow").forEach(l => l.remove());
    }
    document.querySelectorAll(".grid-cell").forEach(c => {
      c.classList.remove("highlight-attacker", "highlight-target", "highlight-special");
    });
  }

  spawnBoom(targetIdx, dmg, isSpecial = false) {
    const cell = document.getElementById(`cell-${targetIdx}`);
    if (!cell) return;
    const overlay = document.getElementById("effect-overlay");
    const rectOverlay = overlay.getBoundingClientRect();
    const rect = cell.getBoundingClientRect();

    const cx = rect.left + rect.width / 2 - rectOverlay.left;
    const cy = rect.top + rect.height / 2 - rectOverlay.top;

    const boom = document.createElement("div");
    boom.className = "scratch-boom";
    boom.textContent = isSpecial ? "💥💥" : "💥";
    boom.style.left = `${cx}px`;
    boom.style.top = `${cy}px`;
    if (isSpecial) boom.style.fontSize = "3.4rem";
    overlay.appendChild(boom);

    const num = document.createElement("div");
    num.className = "scratch-dmg-text";
    num.textContent = `-${dmg}`;
    num.style.left = `${cx}px`;
    num.style.top = `${cy - 12}px`;
    if (isSpecial) {
      num.style.fontSize = "2.3rem";
      num.style.color = "#ffff00";
      num.style.textShadow = "2px 2px 0 #ff0000, -1px -1px 0 #000";
    }
    overlay.appendChild(num);

    setTimeout(() => {
      boom.remove();
      num.remove();
    }, 450);
  }

  announceWinner(winnerIdx) {
    audio.playFanfare();
    const winner = this.fighters[winnerIdx];
    const banner = document.getElementById("winner-banner");
    if (winner) {
      document.getElementById("winner-title").textContent = `勝者：${winner.name}！！`;
      document.getElementById("winner-quote").textContent = `「${winner.specialQuote || winner.quote}」`;
    } else {
      document.getElementById("winner-title").textContent = "引き分け！！";
      document.getElementById("winner-quote").textContent = "全員相討ちにより勝者なし！";
    }
    banner.style.display = "flex";
  }

  openAddModal(slotIdx) {
    this.targetSlotIdx = slotIdx;
    this.tempUploadData = null;
    document.getElementById("custom-name").value = "";
    document.getElementById("custom-hp").value = "100";
    document.getElementById("custom-skill").value = "パンチ";
    document.getElementById("custom-quote").value = "いくぞ！";
    document.getElementById("custom-special").value = "超メガ粒子砲";
    document.getElementById("custom-special-quote").value = "喰らえええええ！";
    document.getElementById("custom-special-type").value = "kill";
    document.getElementById("file-selector").value = "";
    document.getElementById("upload-modal").style.display = "flex";
  }

  saveCustomCharacter() {
    const name = document.getElementById("custom-name").value.trim() || "オリジナル戦士";
    const hp = parseInt(document.getElementById("custom-hp").value, 10) || 100;
    const skill = document.getElementById("custom-skill").value.trim() || "パンチ";
    const quote = document.getElementById("custom-quote").value.trim() || "いくぞ！";
    const specialName = document.getElementById("custom-special").value.trim() || "超メガ粒子砲";
    const specialQuote = document.getElementById("custom-special-quote").value.trim() || "喰らえええええ！";
    const specialType = document.getElementById("custom-special-type").value || "kill";

    const img = this.tempUploadData || makeIconSvg(name, "#ff00bb", "★");

    const newChar = {
      name,
      img,
      hp,
      skill,
      quote,
      specialName,
      specialQuote,
      specialType
    };

    try {
      let custom = [];
      const s = localStorage.getItem("scratch_chaos_custom");
      if (s) custom = JSON.parse(s);
      custom.push(newChar);
      localStorage.setItem("scratch_chaos_custom", JSON.stringify(custom));
    } catch (e) {}

    document.getElementById("upload-modal").style.display = "none";
    this.initFighters();
    this.renderGrid();
    document.getElementById("subtitle-bar").textContent = `「${name}」がカオスバトルに参戦した！！`;
  }

  onCellClicked(idx) {
    const f = this.fighters[idx];
    if (!f) return;
    if (!f.isAlive) {
      f.isAlive = true;
      f.hp = f.maxHp;
      this.renderGrid();
      audio.playBell();
      document.getElementById("subtitle-bar").textContent = `✨ ${f.name} が奇跡の復活！！`;
    } else {
      audio.init();
      // Manual click forces this fighter's special move immediately!
      this.pause();
      this.step(idx, true);
    }
  }
}

window.addEventListener("DOMContentLoaded", () => {
  window.chaosApp = new ScratchChaosBattle();
});
</script>
