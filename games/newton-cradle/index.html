<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ニュートン・クォータ — 10秒ノルマ達成型 物理演算ローグライク</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0e17;
      color: #e6ecf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: min(100vw, 177.78vh);
      height: min(100vh, 56.25vw);
      outline: none;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }
    .top-nav-btn {
      position: fixed;
      z-index: 30;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(10, 14, 23, 0.88);
      border: 1px solid rgba(212, 167, 86, 0.6);
      color: #f3dfb0;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .top-nav-btn:hover {
      background: rgba(212, 167, 86, 0.25);
    }
    .top-nav-btn:active {
      transform: scale(0.95);
    }
    #back-link {
      top: max(8px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
    }
    #fullscreen-btn {
      top: max(8px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
    }
    #rotate-hint {
      display: none;
      position: fixed;
      top: max(48px, calc(env(safe-area-inset-top) + 40px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 14, 23, 0.94);
      border: 1px solid rgba(212, 167, 86, 0.75);
      color: #f3dfb0;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      z-index: 25;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }
    @media (orientation: portrait) and (max-width: 800px) {
      #rotate-hint { display: block; }
    }
    #loader-container {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 420px);
      background: rgba(10, 14, 23, 0.92);
      border: 1px solid rgba(212, 167, 86, 0.65);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      z-index: 20;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    #gmini-status {
      font-size: 13px;
      color: #f3dfb0;
      text-align: center;
      margin-bottom: 6px;
      word-break: break-all;
    }
    #progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #45c8f5, #38e895);
      transition: width 0.1s ease;
    }
  </style>
</head>
<body>
  <a id="back-link" class="top-nav-btn" href="../../index.html" tabindex="-1">← 一覧へ</a>
  <button id="fullscreen-btn" class="top-nav-btn" type="button" tabindex="-1">⛶ 全画面</button>
  <div id="rotate-hint" onclick="this.style.display='none'">🔄 スマホ横画面推奨（全画面ボタンで快適プレイ・タップ/スワイプ対応）</div>

  <canvas id="gmini-canvas" width="1280" height="720" tabindex="0"></canvas>
  <div id="loader-container">
    <div id="gmini-status">読み込み準備中... / Preparing WASM...</div>
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  </div>

  <script type="module">
    const canvas = document.getElementById("gmini-canvas");
    const loaderContainer = document.getElementById("loader-container");
    const statusEl = document.getElementById("gmini-status");
    const progressFill = document.getElementById("progress-bar-fill");
    const fsBtn = document.getElementById("fullscreen-btn");

    function focusCanvas() {
      if (document.activeElement !== canvas) {
        canvas.focus({ preventScroll: true });
      }
    }
    window.addEventListener("pointerdown", (e) => {
      if (e.target && (e.target.id === "back-link" || e.target.id === "fullscreen-btn")) return;
      focusCanvas();
      if (loaderContainer && loaderContainer.style.opacity === "1") {
        loaderContainer.style.opacity = "0";
      }
    });
    window.addEventListener("keydown", (e) => {
      focusCanvas();
      if (["Space", "Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }
      if (loaderContainer && loaderContainer.style.opacity === "1") {
        loaderContainer.style.opacity = "0";
      }
    }, { capture: true });

    if (fsBtn) {
      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          fsBtn.textContent = "✕ 縮小";
        } else {
          document.exitFullscreen().catch(() => {});
          fsBtn.textContent = "⛶ 全画面";
        }
      });
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && fsBtn) {
          fsBtn.textContent = "⛶ 全画面";
        }
      });
    }

    async function fetchWithProgress(url) {
      const resp = await fetch(url);
      if (!resp.ok) {
        throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
      }
      const contentLength = resp.headers.get("Content-Length");
      if (!contentLength || !resp.body) {
        statusEl.textContent = "WASMダウンロード中...";
        return resp;
      }
      const total = parseInt(contentLength, 10);
      let loaded = 0;
      const reader = resp.body.getReader();
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        const pct = Math.min(100, Math.round((loaded / total) * 100));
        const mb = (loaded / (1024 * 1024)).toFixed(1);
        const totalMb = (total / (1024 * 1024)).toFixed(1);
        statusEl.textContent = `ゲーム読み込み中... ${pct}% (${mb}MB / ${totalMb}MB)`;
        progressFill.style.width = `${pct}%`;
      }
      const allBytes = new Uint8Array(loaded);
      let offset = 0;
      for (const chunk of chunks) {
        allBytes.set(chunk, offset);
        offset += chunk.length;
      }
      statusEl.textContent = "エンジン起動中... / Initializing engine...";
      progressFill.style.width = "100%";
      return allBytes.buffer;
    }

    import init from "./pkg/newton_cradle_lib.js";

    (async () => {
      try {
        const wasmBytes = await fetchWithProgress("./pkg/newton_cradle_lib_bg.wasm");
        await init(wasmBytes);
        focusCanvas();
        statusEl.textContent = "玉をドラッグ/タップして弾こう！";
        setTimeout(() => {
          if (loaderContainer) loaderContainer.style.opacity = "0";
        }, 4500);
      } catch (e) {
        console.error("Gmini WASM boot error:", e);
        if (statusEl) {
          statusEl.style.color = "#ff6b6b";
          statusEl.textContent = "起動エラー: " + (e?.message || e) + " (Ctrl+Shift+R で再読み込みをお試しください)";
        }
      }
    })();
  </script>
</body>
</html>
