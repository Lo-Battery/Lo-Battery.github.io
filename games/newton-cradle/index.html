<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ニュートン・クォータ — 10秒ノルマ達成型 物理演算ローグライク</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0e17;
      color: #e6ecf5;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: min(100vw, 177.78vh);
      height: min(100vh, 56.25vw);
      outline: none;
      cursor: pointer;
    }
    #back-link {
      position: fixed;
      top: 8px;
      left: 12px;
      z-index: 30;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(10, 14, 23, 0.85);
      border: 1px solid rgba(212, 167, 86, 0.5);
      color: #f3dfb0;
      text-decoration: none;
      font-size: 13px;
      transition: background 0.15s ease;
    }
    #back-link:hover {
      background: rgba(212, 167, 86, 0.25);
    }
    #loader-container {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 420px);
      background: rgba(10, 14, 23, 0.92);
      border: 1px solid rgba(212, 167, 86, 0.65);
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      z-index: 20;
      transition: opacity 0.4s ease;
    }
    #gmini-status {
      font-size: 13px;
      color: #f3dfb0;
      text-align: center;
      margin-bottom: 6px;
      word-break: break-all;
    }
    #progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #45c8f5, #38e895);
      transition: width 0.1s ease;
    }
  </style>
</head>
<body>
  <a id="back-link" href="../../index.html" tabindex="-1">← ゲーム一覧へ</a>
  <canvas id="gmini-canvas" width="1280" height="720" tabindex="0"></canvas>
  <div id="loader-container">
    <div id="gmini-status">読み込み準備中... / Preparing WASM...</div>
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  </div>

  <script type="module">
    const canvas = document.getElementById("gmini-canvas");
    const loaderContainer = document.getElementById("loader-container");
    const statusEl = document.getElementById("gmini-status");
    const progressFill = document.getElementById("progress-bar-fill");

    function focusCanvas() {
      if (document.activeElement !== canvas) {
        canvas.focus({ preventScroll: true });
      }
    }
    window.addEventListener("pointerdown", (e) => {
      if (e.target && e.target.id === "back-link") return;
      focusCanvas();
      if (loaderContainer && loaderContainer.style.opacity === "1") {
        loaderContainer.style.opacity = "0";
      }
    });
    window.addEventListener("keydown", (e) => {
      focusCanvas();
      if (["Space", "Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }
      if (loaderContainer && loaderContainer.style.opacity === "1") {
        loaderContainer.style.opacity = "0";
      }
    }, { capture: true });

    async function fetchWithProgress(url) {
      const resp = await fetch(url);
      if (!resp.ok) {
        throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
      }
      const contentLength = resp.headers.get("Content-Length");
      if (!contentLength || !resp.body) {
        statusEl.textContent = "WASMダウンロード中...";
        return resp;
      }
      const total = parseInt(contentLength, 10);
      let loaded = 0;
      const reader = resp.body.getReader();
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        const pct = Math.min(100, Math.round((loaded / total) * 100));
        const mb = (loaded / (1024 * 1024)).toFixed(1);
        const totalMb = (total / (1024 * 1024)).toFixed(1);
        statusEl.textContent = `ゲーム読み込み中... ${pct}% (${mb}MB / ${totalMb}MB)`;
        progressFill.style.width = `${pct}%`;
      }
      const allBytes = new Uint8Array(loaded);
      let offset = 0;
      for (const chunk of chunks) {
        allBytes.set(chunk, offset);
        offset += chunk.length;
      }
      statusEl.textContent = "エンジン起動中... / Initializing engine...";
      progressFill.style.width = "100%";
      return allBytes.buffer;
    }

    import init from "./pkg/newton_cradle_lib.js";

    (async () => {
      try {
        const wasmBytes = await fetchWithProgress("./pkg/newton_cradle_lib_bg.wasm");
        await init(wasmBytes);
        focusCanvas();
        statusEl.textContent = "10秒以内に玉を引いてノルマ達成！右パネルで倍速・スキル確認";
        setTimeout(() => {
          if (loaderContainer) loaderContainer.style.opacity = "0";
        }, 4000);
      } catch (e) {
        console.error("Gmini WASM boot error:", e);
        if (statusEl) {
          statusEl.style.color = "#ff6b6b";
          statusEl.textContent = "起動エラー: " + (e?.message || e) + " (Ctrl+Shift+R で再読み込みをお試しください)";
        }
      }
    })();
  </script>
</body>
</html>
