<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ニュートンの揺籃クリッカー — Lo-Battery</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #090d16;
      color: #e6ecf5;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: min(100vw, 177.78vh);
      height: min(100vh, 56.25vw);
      outline: none;
      cursor: pointer;
    }
    #back-link {
      position: fixed;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 3px 12px;
      border-radius: 999px;
      background: rgba(9, 13, 22, 0.78);
      border: 1px solid rgba(212, 167, 86, 0.45);
      color: #f3dfb0;
      text-decoration: none;
      font-size: 12px;
      opacity: 0.78;
      transition: opacity 0.15s ease;
    }
    #back-link:hover {
      opacity: 1;
    }
    #gmini-status {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(9, 13, 22, 0.9);
      border: 1px solid rgba(212, 167, 86, 0.6);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <a id="back-link" href="../../index.html" tabindex="-1">← ゲーム一覧へ</a>
  <canvas id="gmini-canvas" width="1280" height="720" tabindex="0"></canvas>
  <div id="gmini-status">読み込み中... / Loading WASM...</div>
  <script type="module">
    const canvas = document.getElementById("gmini-canvas");
    const statusEl = document.getElementById("gmini-status");

    function focusCanvas() {
      if (document.activeElement !== canvas) {
        canvas.focus({ preventScroll: true });
      }
    }
    window.addEventListener("pointerdown", (e) => {
      if (e.target && e.target.id === "back-link") return;
      focusCanvas();
      if (statusEl) statusEl.style.opacity = "0";
    });
    window.addEventListener("keydown", (e) => {
      focusCanvas();
      if (["Space", "Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }
      if (statusEl) statusEl.style.opacity = "0";
    }, { capture: true });

    import init from "./pkg/newton_cradle_lib.js";
    init()
      .then(() => {
        focusCanvas();
        if (statusEl) {
          statusEl.textContent = "揺籃ステージをクリックしてエネルギー生産！右パネルでまとめ買い・特殊球を強化";
          setTimeout(() => { statusEl.style.opacity = "0"; }, 4500);
        }
      })
      .catch((e) => {
        console.error("Gmini WASM boot error:", e);
        if (statusEl) {
          statusEl.style.opacity = "1";
          statusEl.style.borderColor = "#e04848";
          statusEl.textContent = "起動エラー: " + (e?.message || e);
        }
      });
  </script>
</body>
</html>
