<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>極割 -KIWAMI WARIBASHI- | アスペン元禄箸 究極の二本指割り</title>
  <meta name="theme-color" content="#141312" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #141312;
      color: #f5e6cb;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 600px;
      background: #141312;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    /* 上部ヘッダーHUD */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      z-index: 9999;
      background: linear-gradient(180deg, rgba(20,19,18,0.85) 0%, rgba(20,19,18,0.0) 100%);
      pointer-events: none;
    }

    .action-btn {
      background: rgba(212, 175, 55, 0.25);
      border: 1.5px solid #d4af37;
      color: #ffd166;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 14px;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.15s ease;
      pointer-events: auto !important;
    }
    .action-btn:active {
      background: #d4af37;
      color: #141312;
      transform: scale(0.95);
    }

    /* キャンバスコンテナ */
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas#gmini-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* ロード画面 */
    #loader {
      position: absolute;
      inset: 0;
      background: #141312;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.4s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-text {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #f5e6cb;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .sub-text {
      font-size: 13px;
      color: #a89f91;
      margin-bottom: 24px;
    }

    .progress-bar {
      width: 220px;
      height: 6px;
      background: #2a2622;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #4a4237;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #ffe699);
      transition: width 0.1s ease;
    }
    .loading-status {
      font-size: 11px;
      color: #8c8273;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="top-bar">
      <button class="action-btn" id="btn-restart">もう一膳</button>
    </div>

    <div id="canvas-container">
      <canvas id="gmini-canvas" tabindex="0"></canvas>
    </div>

    <div id="loader">
      <div class="logo-text">極 割</div>
      <div class="sub-text">アスペン元禄箸 究極の二本指割り</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="loading-status" id="loading-status">木目を準備中...</div>
    </div>
  </div>

  <script type="module">
    const APP_VERSION = "20261119_v9";
    import init from "./pkg/waribashi_lib.js?v=20261119_v9";

    // Web Overlay グローバルブリッジ
    window.gminiOverlay = {
      queue: [],
      sendAction(action, payload = {}) {
        this.queue.push({ action, payload });
      },
      popActions() {
        const out = this.queue;
        this.queue = [];
        return out;
      },
      drainActions() {
        return this.popActions();
      },
      onEvent(event, data) {
        if (event === "haptic") {
          handleHaptic(data);
        } else if (event === "result") {
          console.log("[Result]", data);
        }
      }
    };

    function attachButton(id, handler) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
      });
      el.addEventListener("touchstart", (e) => {
        e.stopPropagation();
      }, { passive: true });
      el.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        el.blur();
        const canvas = document.getElementById("gmini-canvas");
        if (canvas) canvas.focus();
        handler();
      });
    }

    attachButton("btn-restart", () => {
      window.gminiOverlay.sendAction("restart");
    });

    // 触覚バイブレーション (Web Vibration API)
    function handleHaptic(data) {
      if (!("vibrate" in navigator)) return;
      try {
        switch (data.type) {
          case "touch":
            navigator.vibrate(10);
            break;
          case "strain":
            navigator.vibrate(8);
            break;
          case "crack":
            navigator.vibrate(18);
            break;
          case "splinter":
            navigator.vibrate([12, 20, 12]);
            break;
          case "snap":
            navigator.vibrate([60, 30, 90]);
            break;
        }
      } catch (e) {
        // Ignored
      }
    }

    // fetchWithProgress による WASM ストリーミングロード
    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const contentLength = response.headers.get("content-length");
      const total = contentLength ? parseInt(contentLength, 10) : 0;
      let loaded = 0;

      const reader = response.body.getReader();
      const chunks = [];
      const fillEl = document.getElementById("progress-fill");
      const statusEl = document.getElementById("loading-status");

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;

        if (total > 0 && fillEl) {
          const pct = Math.min(100, Math.round((loaded / total) * 100));
          fillEl.style.width = pct + "%";
          if (statusEl) statusEl.textContent = `読み込み中... ${pct}%`;
        }
      }

      const all = new Uint8Array(loaded);
      let offset = 0;
      for (const chunk of chunks) {
        all.set(chunk, offset);
        offset += chunk.length;
      }
      return all.buffer;
    }

    async function start() {
      try {
        const wasmBytes = await fetchWithProgress(`./pkg/waribashi_lib_bg.wasm?v=${APP_VERSION}`);
        const statusEl = document.getElementById("loading-status");
        if (statusEl) statusEl.textContent = "起動中...";

        await init(wasmBytes);

        const loader = document.getElementById("loader");
        if (loader) {
          loader.classList.add("hidden");
          setTimeout(() => loader.remove(), 400);
        }
      } catch (err) {
        console.error("WASM startup error:", err);
        const statusEl = document.getElementById("loading-status");
        if (statusEl) {
          statusEl.textContent = "起動エラー: " + err.message;
          statusEl.style.color = "#ff6b6b";
        }
      }
    }

    start();
  </script>
</body>
</html>
