<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ねわるろ20秒 — 「ね・わ」「る・ろ」極限見分けスプリント</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #090d14;
      color: #e6ecf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: min(100vw, 177.78vh);
      height: min(100vh, 56.25vw);
      outline: none;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }
    #back-link {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      z-index: 30;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(13, 17, 26, 0.88);
      border: 1px solid rgba(56, 217, 169, 0.5);
      color: #38d9a9;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    #back-link:hover {
      background: rgba(56, 217, 169, 0.25);
      transform: scale(1.02);
    }
    #fullscreen-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 30;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(13, 17, 26, 0.88);
      border: 1px solid rgba(56, 217, 169, 0.5);
      color: #38d9a9;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    #fullscreen-btn:hover {
      background: rgba(56, 217, 169, 0.25);
      transform: scale(1.02);
    }
    #fullscreen-btn:active {
      transform: scale(0.95);
    }
    #loader-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 440px);
      background: rgba(13, 17, 26, 0.94);
      border: 1px solid rgba(56, 217, 169, 0.65);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      z-index: 20;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    #gmini-status {
      font-size: 13px;
      color: #a4b0be;
      text-align: center;
      margin-bottom: 8px;
      word-break: break-all;
    }
    #progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38d9a9, #ff922b);
      transition: width 0.1s ease;
    }
  </style>
</head>
<body>
  <a id="back-link" href="../../index.html" tabindex="-1">← 一覧へ</a>
  <button id="fullscreen-btn" type="button" tabindex="-1">⛶ 全画面</button>
  <canvas id="gmini-canvas" width="1280" height="720" tabindex="0"></canvas>
  <div id="loader-container">
    <div id="gmini-status">読み込み準備中... / Preparing WASM...</div>
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  </div>

  <script type="module">
    const canvas = document.getElementById("gmini-canvas");
    const loaderContainer = document.getElementById("loader-container");
    const statusEl = document.getElementById("gmini-status");
    const progressFill = document.getElementById("progress-bar-fill");
    const fsBtn = document.getElementById("fullscreen-btn");

    if (fsBtn) {
      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          fsBtn.textContent = "✕ 縮小";
        } else {
          document.exitFullscreen().catch(() => {});
          fsBtn.textContent = "⛶ 全画面";
        }
      });
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && fsBtn) {
          fsBtn.textContent = "⛶ 全画面";
        }
      });
    }

    function focusCanvas() {
      if (document.activeElement !== canvas) {
        canvas.focus({ preventScroll: true });
      }
    }

    // 右クリックのコンテキストメニューを抑制（ゲーム内の右クリック判定を有効化）
    window.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });
    canvas.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });

    // タッチスクロール防止
    document.addEventListener("touchmove", (e) => {
      if (e.target === canvas) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener("pointerdown", (e) => {
      if (e.target && e.target.id === "back-link") return;
      focusCanvas();
      if (loaderContainer && loaderContainer.style.opacity === "1") {
        loaderContainer.style.opacity = "0";
      }
    });

    window.addEventListener("keydown", (e) => {
      focusCanvas();
      if (["Space", "Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }
      if (loaderContainer && loaderContainer.style.opacity === "1") {
        loaderContainer.style.opacity = "0";
      }
    }, { capture: true });

    async function fetchWithProgress(url) {
      const resp = await fetch(url);
      if (!resp.ok) {
        throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
      }
      const contentLength = resp.headers.get("Content-Length");
      if (!contentLength || !resp.body) {
        statusEl.textContent = "WASMダウンロード中...";
        return resp;
      }
      const total = parseInt(contentLength, 10);
      let loaded = 0;
      const reader = resp.body.getReader();
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        const pct = Math.min(100, Math.round((loaded / total) * 100));
        const mb = (loaded / (1024 * 1024)).toFixed(1);
        const totalMb = (total / (1024 * 1024)).toFixed(1);
        statusEl.textContent = `ゲーム読み込み中... ${pct}% (${mb}MB / ${totalMb}MB)`;
        progressFill.style.width = `${pct}%`;
      }
      const allBytes = new Uint8Array(loaded);
      let offset = 0;
      for (const chunk of chunks) {
        allBytes.set(chunk, offset);
        offset += chunk.length;
      }
      statusEl.textContent = "エンジン起動中... / Initializing engine...";
      progressFill.style.width = "100%";
      return allBytes.buffer;
    }

    import init from "./pkg/newaruro_lib.js";

    (async () => {
      try {
        const wasmBytes = await fetchWithProgress("./pkg/newaruro_lib_bg.wasm");
        await init(wasmBytes);
        focusCanvas();
        statusEl.textContent = "クルッと結んで左！ スッと払って右！";
        setTimeout(() => {
          if (loaderContainer) loaderContainer.style.opacity = "0";
        }, 3000);
      } catch (e) {
        console.error("Gmini WASM boot error:", e);
        if (statusEl) {
          statusEl.style.color = "#ff6b6b";
          statusEl.textContent = "起動エラー: " + (e?.message || e) + " (Ctrl+Shift+R で再読み込みをお試しください)";
        }
      }
    })();
  </script>
</body>
</html>
