<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lo-Battery Game Portal</title>
  <style>
    :root {
      --bg: #0c1018;
      --surface: #151c29;
      --surface-hover: #1b2436;
      --border: #2a3752;
      --text: #eef3fb;
      --muted: #9aa9c4;
      --accent: #45c8f5;
      --accent-hover: #6ad7fb;
      --green: #38d9a9;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #162238 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
      line-height: 1.6;
    }
    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(50px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      letter-spacing: 0.02em;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.88rem, 2.5vw, 0.98rem);
    }
    .notice-box {
      margin: 10px 0 0;
      font-size: 0.8rem;
      color: #7e93b5;
      background: rgba(10, 14, 22, 0.5);
      border: 1px solid rgba(42, 55, 82, 0.5);
      border-radius: 8px;
      padding: 8px 12px;
      line-height: 1.5;
    }

    /* タグフィルターバー */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .filter-label {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      white-space: nowrap;
    }
    .filter-chip:hover {
      background: rgba(69, 200, 245, 0.15);
      color: #fff;
      border-color: rgba(69, 200, 245, 0.4);
    }
    .filter-chip:active {
      transform: scale(0.96);
    }
    .filter-chip.active {
      background: var(--accent);
      color: #07131d;
      border-color: var(--accent);
      font-weight: 700;
    }
    .filter-chip .chip-count {
      font-size: 0.72rem;
      opacity: 0.88;
      background: rgba(0, 0, 0, 0.22);
      padding: 1px 6px;
      border-radius: 999px;
    }
    .filter-chip.active .chip-count {
      background: rgba(0, 0, 0, 0.28);
      color: #07131d;
    }

    /* スマホ画面でのタグ横スクロール最適化 */
    @media (max-width: 640px) {
      .filter-bar {
        padding: 8px 10px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .filter-label {
        font-size: 0.78rem;
      }
      #filter-chips {
        flex-wrap: nowrap !important;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
        scrollbar-width: none;
      }
      #filter-chips::-webkit-scrollbar {
        display: none;
      }
      .filter-chip {
        flex-shrink: 0;
        padding: 5px 11px;
        font-size: 0.78rem;
      }
    }

    /* ゲームカードグリッド */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }
    @media (max-width: 480px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }
    @media (hover: hover) {
      .card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        background: var(--surface-hover);
      }
    }
    .card:active {
      transform: scale(0.99);
    }
    .thumb-wrap {
      aspect-ratio: 16 / 9;
      background: #090d14;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .badge-mobile {
      background: rgba(56, 217, 169, 0.25);
      border: 1px solid rgba(56, 217, 169, 0.7);
      color: #38d9a9;
    }
    .badge-pc {
      background: rgba(154, 169, 196, 0.2);
      border: 1px solid rgba(154, 169, 196, 0.5);
      color: #c4d1eb;
    }
    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
    }
    .card-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .card-sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(69, 200, 245, 0.12);
      border: 1px solid rgba(69, 200, 245, 0.35);
      color: #a9e7fc;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .tag:hover {
      background: rgba(69, 200, 245, 0.28);
      border-color: var(--accent);
      color: #fff;
    }
    .tag:active {
      transform: scale(0.95);
    }
    .tag.active {
      background: var(--accent);
      color: #07131d;
      border-color: var(--accent);
      font-weight: 700;
    }
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
      background: rgba(10, 14, 22, 0.65);
      border: 1px solid rgba(42, 55, 82, 0.7);
      border-radius: 8px;
      padding: 7px 10px;
      line-height: 1.45;
    }
    .play-btn {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.98rem;
      min-height: 46px;
      padding: 12px 18px;
      border-radius: 10px;
      background: var(--accent);
      color: #07131d;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .play-btn:hover {
      background: var(--accent-hover);
    }
    .play-btn:active {
      transform: scale(0.97);
    }
    .card-placeholder {
      border-style: dashed;
      opacity: 0.75;
      justify-content: center;
      align-items: center;
      min-height: 240px;
      padding: 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 16px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
    }
    .empty-state button {
      margin-top: 14px;
      background: var(--accent);
      color: #07131d;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
    }
    footer {
      margin-top: 36px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Lo-Battery ゲーム一覧</h1>
      <p class="lead">ブラウザを開くだけで、インストール不要でそのまま遊べる自作ゲーム集です。</p>
      <div class="notice-box">
        💡 <strong>スマホで遊ぶ方へ:</strong> スマホ対応マークのゲームは画面タップやスワイプでそのまま遊べます。初回起動時のみエンジン読込（約7MB）があります。画面が切り替わらない場合はブラウザの再読み込みをお試しください。
      </div>
    </header>

    <!-- タグフィルターUI -->
    <nav id="filter-bar" class="filter-bar" aria-label="タグフィルター">
      <span class="filter-label">🏷️ 絞込:</span>
      <div id="filter-chips"></div>
    </nav>

    <main id="game-grid" class="grid"></main>

    <footer>
      Powered by <strong>Gmini</strong> 2D Engine (Rust + WebAssembly / WebGPU / WebGL2)
    </footer>
  </div>

  <script>
    const FALLBACK_GAMES = [
      {
        id: "newaruro",
        title: "ねわるろ20秒",
        subtitle: "「ね・わ」「る・ろ」の結び目を見分ける20秒極限スプリント！",
        engine: "Gmini 2D Engine (Rust + WebGPU / WebGL2)",
        url: "./games/newaruro/index.html",
        thumbnail: "./assets/newaruro.png",
        controls: "スマホ: 左右スワイプ | PC: 左右クリック (または [←][→] / [A][D] キー)",
        platform_note: "PC・スマホ両対応（WebGPU / WebGL2・インストール不要）",
        tags: ["アクション", "カジュアル", "パズル", "2D", "Gmini"]
      },
      {
        id: "newton-cradle",
        title: "ニュートン・クォータ",
        subtitle: "10秒ノルマ達成型 物理演算ローグライク",
        engine: "Gmini 2D Engine (Rust + WebGPU / WebGL2)",
        url: "./games/newton-cradle/index.html",
        thumbnail: "./assets/newton-cradle.png",
        controls: "マウスドラッグ: 玉を掴んで引っ張る・衝突させる | 1〜4キー: 倍速切替 | ショップ内1〜3キー: ドラフト/球配置替/スキル一覧切替",
        platform_note: "PCブラウザ向け（WebGPU / WebGL2・インストール不要）",
        tags: ["ローグライク", "物理演算", "2D", "Gmini"]
      },
      {
        id: "kuso-daifugo",
        title: "クソ大富豪 〜ローカルルール全部乗せ〜",
        subtitle: "24種の公式＆カオスルール全盛りCPU対戦カードゲーム",
        engine: "Gmini 2D Engine (Rust + WebGPU / WebGL2)",
        url: "./games/kuso-daifugo/index.html",
        thumbnail: "./assets/kuso-daifugo.png",
        controls: "マウス/タップ: カード選択・出す・パス | 矢印キー: 選択移動 | Space: 決定 | 1〜5: 人数・ルールプリセット切替",
        platform_note: "PC/タブレットブラウザ向け（WebGPU / WebGL2・インストール不要）",
        tags: ["カード", "大富豪", "カジュアル", "Gmini"]
      },
      {
        id: "gmini-survivors",
        title: "Gmini Survivors（試作アクション）",
        subtitle: "見下ろし型ローグライクアクション",
        engine: "Gmini 2D Engine (Rust + WebGPU / WebGL2)",
        url: "./games/gmini-survivors/index.html",
        thumbnail: "./assets/gmini-survivors.png",
        controls: "WASD / 矢印: 移動 | Space / Aボタン: ダッシュ | クリック: 照準強化 | 1/2/3 or クリック: レベルアップ選択",
        platform_note: "PCブラウザ向け（WebGPU / WebGL2・インストール不要）",
        tags: ["アクション", "ローグライク", "2D", "Gmini"]
      }
    ];

    let allGames = [];
    let currentTag = "all";

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[c]));
    }

    function getTagFromHash() {
      const match = window.location.hash.match(/tag=([^&]+)/);
      return match ? decodeURIComponent(match[1]) : "all";
    }

    function setTag(tag) {
      currentTag = tag;
      if (tag === "all") {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      } else {
        history.replaceState(null, "", `#tag=${encodeURIComponent(tag)}`);
      }
      renderFilterChips();
      renderGameGrid();
    }

    function computeTagCounts() {
      const counts = { all: allGames.length };
      allGames.forEach((g) => {
        (g.tags || []).forEach((t) => {
          counts[t] = (counts[t] || 0) + 1;
        });
      });
      return counts;
    }

    function renderFilterChips() {
      const container = document.getElementById("filter-chips");
      const counts = computeTagCounts();
      
      const tagList = Object.keys(counts)
        .filter((t) => t !== "all")
        .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, "ja"));
      tagList.unshift("all");

      container.innerHTML = tagList.map((tag) => {
        const isActive = tag === currentTag;
        const label = tag === "all" ? "すべて" : tag;
        const count = counts[tag] || 0;
        return `
          <button type="button" class="filter-chip ${isActive ? "active" : ""}" data-tag="${escapeHtml(tag)}">
            ${escapeHtml(label)}
            <span class="chip-count">${count}</span>
          </button>
        `;
      }).join("");

      container.querySelectorAll(".filter-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          setTag(btn.dataset.tag);
        });
      });
    }

    function isMobileReady(g) {
      const text = ((g.platform_note || "") + (g.controls || "")).toLowerCase();
      return text.includes("スマホ") || text.includes("タップ") || text.includes("スワイプ");
    }

    function renderGameGrid() {
      const grid = document.getElementById("game-grid");
      const filtered = currentTag === "all"
        ? allGames
        : allGames.filter((g) => (g.tags || []).includes(currentTag));

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <p>タグ <strong>「${escapeHtml(currentTag)}」</strong> に一致するゲームは現在ありません。</p>
            <button type="button" id="reset-filter-btn">すべてのゲームを表示</button>
          </div>
        `;
        document.getElementById("reset-filter-btn").addEventListener("click", () => setTag("all"));
        return;
      }

      const cardsHtml = filtered.map((g) => {
        const mobileOk = isMobileReady(g);
        const badgeHtml = mobileOk
          ? `<span class="thumb-badge badge-mobile">📱 スマホ対応</span>`
          : `<span class="thumb-badge badge-pc">💻 PC推奨</span>`;

        return `
          <article class="card">
            <div class="thumb-wrap">
              <img src="${escapeHtml(g.thumbnail)}" alt="${escapeHtml(g.title)}" loading="lazy" />
              ${badgeHtml}
            </div>
            <div class="card-body">
              <h2 class="card-title">${escapeHtml(g.title)}</h2>
              <p class="card-sub">${escapeHtml(g.subtitle)}</p>
              <div class="tags">
                ${(g.tags || []).map((t) => `
                  <span class="tag ${t === currentTag ? "active" : ""}" data-tag="${escapeHtml(t)}" title="タグ「${escapeHtml(t)}」で絞り込む">
                    ${escapeHtml(t)}
                  </span>
                `).join("")}
              </div>
              <div class="meta"><strong>操作:</strong> ${escapeHtml(g.controls)}</div>
              <a class="play-btn" href="${escapeHtml(g.url)}">ブラウザで遊ぶ</a>
            </div>
          </article>
        `;
      }).join("");

      const placeholderHtml = currentTag === "all" ? `
        <article class="card card-placeholder">
          <div>
            <strong>次のゲーム枠（準備中）</strong>
            <p style="margin:8px 0 0;font-size:0.86rem;">新しくゲームを作ったら <code>games.json</code> と <code>games/</code> に追加されます。</p>
          </div>
        </article>
      ` : "";

      grid.innerHTML = cardsHtml + placeholderHtml;

      grid.querySelectorAll(".tag").forEach((span) => {
        span.addEventListener("click", (e) => {
          e.preventDefault();
          setTag(span.dataset.tag);
        });
      });
    }

    window.addEventListener("hashchange", () => {
      currentTag = getTagFromHash();
      renderFilterChips();
      renderGameGrid();
    });

    fetch("./games.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : FALLBACK_GAMES))
      .then((data) => {
        allGames = Array.isArray(data) && data.length > 0 ? data : FALLBACK_GAMES;
        currentTag = getTagFromHash();
        renderFilterChips();
        renderGameGrid();
      })
      .catch(() => {
        allGames = FALLBACK_GAMES;
        currentTag = getTagFromHash();
        renderFilterChips();
        renderGameGrid();
      });
  </script>
</body>
</html>
